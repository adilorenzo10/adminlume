name: Release plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to publish (for example v0.3.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish WordPress plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable release tag such as v0.3.0.' >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Check PHP and JavaScript syntax
        run: |
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find src tests -name '*.php' -print0)
          php -l adminlume.php
          node --check assets/js/sidebar.js
          node --check assets/js/frontend-toolbar.js
          node --check tests/topbar-browser.cjs
          node --check tests/frontend-toolbar-browser.cjs

      - name: Test release packaging
        run: python3 -m unittest discover -s tests -p 'test_*release.py' -v

      - name: Build installable ZIP and checksum
        run: python3 scripts/build_release.py --version "$RELEASE_VERSION"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/adminlume-$RELEASE_VERSION.zip" \
            "dist/adminlume-$RELEASE_VERSION.zip.sha256" \
            "dist/adminlume-update.json" \
            --verify-tag \
            --title "Adminlume $RELEASE_VERSION" \
            --generate-notes
